<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

            width: 100%;

    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/RapidTransitStations_1.js"></script>
        <script src="data/RapidTransitLines_2.js"></script>
        <script src="data/VancouverBoundary_3.js"></script>
        <script src="data/parkspolygonrepresentation1parkspolygonrepresentationshp_4.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[49.229959708187124,-123.18653716012395],[49.29426196676571,-123.03967236714614]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_Positron_0');
        map.getPane('pane_Positron_0').style.zIndex = 400;
        var layer_Positron_0 = L.tileLayer('https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            pane: 'pane_Positron_0',
            opacity: 1.0,
            attribution: '<a href="https://cartodb.com/basemaps/">Map tiles by CartoDB, under CC BY 3.0. Data by OpenStreetMap, under ODbL.</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_Positron_0;
        map.addLayer(layer_Positron_0);
        function pop_RapidTransitStations_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['station'] !== null ? autolinker.link(String(feature.properties['station']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['geo_local_a'] !== null ? autolinker.link(String(feature.properties['geo_local_a']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_RapidTransitStations_1_0() {
            return {
                pane: 'pane_RapidTransitStations_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(225,89,137,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_RapidTransitStations_1');
        map.getPane('pane_RapidTransitStations_1').style.zIndex = 401;
        map.getPane('pane_RapidTransitStations_1').style['mix-blend-mode'] = 'normal';
        var layer_RapidTransitStations_1 = new L.geoJson(json_RapidTransitStations_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_RapidTransitStations_1',
            layerName: 'layer_RapidTransitStations_1',
            pane: 'pane_RapidTransitStations_1',
            onEachFeature: pop_RapidTransitStations_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_RapidTransitStations_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_RapidTransitStations_1);
        map.addLayer(layer_RapidTransitStations_1);
        function pop_RapidTransitLines_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">line</th>\
                        <td>' + (feature.properties['line'] !== null ? autolinker.link(String(feature.properties['line']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_RapidTransitLines_2_0() {
            return {
                pane: 'pane_RapidTransitLines_2',
                opacity: 1,
                color: 'rgba(219,30,42,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_RapidTransitLines_2');
        map.getPane('pane_RapidTransitLines_2').style.zIndex = 402;
        map.getPane('pane_RapidTransitLines_2').style['mix-blend-mode'] = 'normal';
        var layer_RapidTransitLines_2 = new L.geoJson(json_RapidTransitLines_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_RapidTransitLines_2',
            layerName: 'layer_RapidTransitLines_2',
            pane: 'pane_RapidTransitLines_2',
            onEachFeature: pop_RapidTransitLines_2,
            style: style_RapidTransitLines_2_0,
        });
        bounds_group.addLayer(layer_RapidTransitLines_2);
        map.addLayer(layer_RapidTransitLines_2);
        function pop_VancouverBoundary_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['name'] !== null ? autolinker.link(String(feature.properties['name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_VancouverBoundary_3_0() {
            return {
                pane: 'pane_VancouverBoundary_3',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_VancouverBoundary_3');
        map.getPane('pane_VancouverBoundary_3').style.zIndex = 403;
        map.getPane('pane_VancouverBoundary_3').style['mix-blend-mode'] = 'normal';
        var layer_VancouverBoundary_3 = new L.geoJson(json_VancouverBoundary_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_VancouverBoundary_3',
            layerName: 'layer_VancouverBoundary_3',
            pane: 'pane_VancouverBoundary_3',
            onEachFeature: pop_VancouverBoundary_3,
            style: style_VancouverBoundary_3_0,
        });
        bounds_group.addLayer(layer_VancouverBoundary_3);
        map.addLayer(layer_VancouverBoundary_3);
        function pop_parkspolygonrepresentation1parkspolygonrepresentationshp_4(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['park_id'] !== null ? autolinker.link(String(feature.properties['park_id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['park_name'] !== null ? autolinker.link(String(feature.properties['park_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['area_ha'] !== null ? autolinker.link(String(feature.properties['area_ha']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['park_url'] !== null ? autolinker.link(String(feature.properties['park_url']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        var pattern_parkspolygonrepresentation1parkspolygonrepresentationshp_4_0 = new L.StripePattern({
            weight: 0.3,
            spaceWeight: 2.0,
            color: '#00d200',
            opacity: 1.0,
            spaceOpacity: 0,
            angle: 315
        });
        pattern_parkspolygonrepresentation1parkspolygonrepresentationshp_4_0.addTo(map);
        function style_parkspolygonrepresentation1parkspolygonrepresentationshp_4_0() {
            return {
                pane: 'pane_parkspolygonrepresentation1parkspolygonrepresentationshp_4',
                stroke: false,
                fillOpacity: 1,
                fillPattern: pattern_parkspolygonrepresentation1parkspolygonrepresentationshp_4_0,
                interactive: true,
            }
        }
        function style_parkspolygonrepresentation1parkspolygonrepresentationshp_4_1() {
            return {
                pane: 'pane_parkspolygonrepresentation1parkspolygonrepresentationshp_4',
                opacity: 1,
                color: 'rgba(0,210,0,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_parkspolygonrepresentation1parkspolygonrepresentationshp_4');
        map.getPane('pane_parkspolygonrepresentation1parkspolygonrepresentationshp_4').style.zIndex = 404;
        map.getPane('pane_parkspolygonrepresentation1parkspolygonrepresentationshp_4').style['mix-blend-mode'] = 'normal';
        var layer_parkspolygonrepresentation1parkspolygonrepresentationshp_4 = new L.geoJson.multiStyle(json_parkspolygonrepresentation1parkspolygonrepresentationshp_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_parkspolygonrepresentation1parkspolygonrepresentationshp_4',
            layerName: 'layer_parkspolygonrepresentation1parkspolygonrepresentationshp_4',
            pane: 'pane_parkspolygonrepresentation1parkspolygonrepresentationshp_4',
            onEachFeature: pop_parkspolygonrepresentation1parkspolygonrepresentationshp_4,
            styles: [style_parkspolygonrepresentation1parkspolygonrepresentationshp_4_0,style_parkspolygonrepresentation1parkspolygonrepresentationshp_4_1,]
        });
        bounds_group.addLayer(layer_parkspolygonrepresentation1parkspolygonrepresentationshp_4);
        map.addLayer(layer_parkspolygonrepresentation1parkspolygonrepresentationshp_4);
        const url = {"Nominatim": "https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&",
        "BAN": "https://api-adresse.data.gouv.fr/search/?"}
        var photonControl = L.control.photon({
            url: url["Nominatim"],
            feedbackLabel: '',
            position: 'topleft',
            includePosition: true,
            initial: true,
            // resultsHandler: myHandler,
        }).addTo(map);
        photonControl._container.childNodes[0].style.borderRadius="10px"
        // Create a variable to store the geoJSON data
        var x = null;
        // Create a variable to store the marker
        var marker = null;
        // Add an event listener to the Photon control to create a marker from the returned geoJSON data
        var z = null;
        photonControl.on('selected', function(e) {
            console.log(photonControl.search.resultsContainer);
            if (x != null) {
                map.removeLayer(obj3.marker);
                map.removeLayer(x);
            }
            obj2.gcd = e.choice;
            x = L.geoJSON(obj2.gcd).addTo(map);
            var label = typeof obj2.gcd.properties.label === 'undefined' ? obj2.gcd.properties.display_name : obj2.gcd.properties.label;
            obj3.marker = L.marker(x.getLayers()[0].getLatLng()).bindPopup(label).addTo(map);
            map.setView(x.getLayers()[0].getLatLng(), 17);
            z = typeof e.choice.properties.label === 'undefined'? e.choice.properties.display_name : e.choice.properties.label;
            console.log(e);
            e.target.input.value = z;
        });
        var search = document.getElementsByClassName("leaflet-photon leaflet-control")[0];
        search.classList.add("leaflet-control-search")
        search.style.display = "flex";
        search.style.backgroundColor="rgba(255,255,255,0.5)" 

        // Créer le nouvel élément bouton
        var button = document.createElement("div");
        button.id = "gcd-button-control";
        button.className = "gcd-gl-btn fa fa-search search-button";

        // Ajouter le bouton à l'élément parent
        search.insertBefore(button, search.firstChild);
        last = search.lastChild;
        last.style.display = "none";
        button.addEventListener("click", function (e) {
            if (last.style.display === "none") {
                last.style.display = "block";
            } else {
                last.style.display = "none";
            }
        });
        var overlaysTree = [
            {label: '<img src="legend/parkspolygonrepresentation1parkspolygonrepresentationshp_4.png" /> parks-polygon-representation (1) — parks-polygon-representation.shp', layer: layer_parkspolygonrepresentation1parkspolygonrepresentationshp_4},
            {label: '<img src="legend/VancouverBoundary_3.png" /> Vancouver Boundary', layer: layer_VancouverBoundary_3},
            {label: '<img src="legend/RapidTransitLines_2.png" /> Rapid Transit Lines', layer: layer_RapidTransitLines_2},
            {label: '<img src="legend/RapidTransitStations_1.png" /> Rapid Transit Stations', layer: layer_RapidTransitStations_1},
            {label: "Positron", layer: layer_Positron_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_RapidTransitStations_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['station'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Tahoma\', sans-serif;">' + layer.feature.properties['station']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_RapidTransitStations_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        var i = 0;
        layer_RapidTransitLines_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['line'] !== null?String('<div style="color: #323232; font-size: 10pt; font-weight: bold; font-family: \'Arial\', sans-serif;">' + layer.feature.properties['line']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_RapidTransitLines_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_RapidTransitStations_1,layer_RapidTransitLines_2]);
        map.on("zoomend", function(){
            resetLabels([layer_RapidTransitStations_1,layer_RapidTransitLines_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_RapidTransitStations_1,layer_RapidTransitLines_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_RapidTransitStations_1,layer_RapidTransitLines_2]);
        });
        </script>
    </body>
</html>
